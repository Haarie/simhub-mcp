[project]
name = "simhub-mcp"
version = "0.1.0"
description = "MCP server exposing SimHub telemetry and controls via the SimHubPropertyServer plugin"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
simhub-mcp = "simhub_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simhub_mcp"]
